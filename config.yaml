domain:
  name: generic
  safety_module: default_safety
  validation_module: default_validator

debug: false

llm:
  provider: ollama
  model: gemma4:e4b
  embedding_model: embeddinggemma:300m
  embedding_provider: ollama
  embedding_api_base: http://localhost:11434
  api_key: "ollama"
  max_tokens: 4096
  temperature: 0.7
  fallback_chain: [ollama]
  max_total_cost_usd: 50.0

agents:
  docker_memory_limit: 2g
  docker_timeout_seconds: 300
  debate_rounds: 3

experiment:
  name: generic_discovery
  max_cycles: 5
  hypotheses_per_cycle: 10
  proximity_threshold: 0.85
