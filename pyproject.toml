[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "co-scientist"
version = "0.2.0"
description = "Multi-Agent AI Scientific Discovery Framework "
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "openai>=1.0",
    "anthropic>=0.18",
    "chromadb>=0.4",
    "hdbscan>=0.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "httpx>=0.25",
    "docker>=7.0",
    "aiodocker>=0.21",
    "rich>=13.0",
    "click>=8.1",
    "trueskill>=0.4.5",
    "textual>=0.50",
    "typer>=0.9",
    "structlog>=24.1.0",
    "cachetools>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=4.4.0",
    "playwright>=1.40.0",
    "sentence-transformers>=2.2.0"
]

[project.scripts]
co-scientist = "co_scientist.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.1"]
